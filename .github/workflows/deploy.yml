name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Production (main → taxtracker) ───────────────────────────────────────
  deploy-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /taxtracker/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

  # ── Staging (dev → taxtracker-dev) ────────────────────────────────────────
  deploy-staging:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /taxtracker-dev/
      - name: Fix manifest and index base path for staging
        run: |
          sed -i 's|/taxtracker/|/taxtracker-dev/|g' dist/manifest.json
          sed -i 's|/taxtracker/|/taxtracker-dev/|g' dist/index.html
      - name: Deploy to taxtracker-dev repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          external_repository: SpitefulGrain40/taxtracker-dev
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
